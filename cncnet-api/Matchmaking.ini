; [Matchmaking.ini] - Unified Configuration for Matchmaking System
;
; This single file defines all matchmaking modes, their official map pools,
; and forced lobby rules (credits, speed, crates, no yuri, etc.).
;
; [How to customize or add a new mode]
; 1. Add mode key under [MatchmakingModes] (e.g., 5=MyMode).
; 2. Create mode section [MyMode] with core settings (UIName, PlayerCount, AssignTeams).
; 3. Create map pool section [MyMode_Maps] with lines formatted as:
;    Index=SHA1_HASH, Friendly Map Name, filename.map
; 4. (Optional) Create [MyMode_ForceCheckboxes] to lock specific options.
; 5. (Optional) Create [MyMode_ForceDropdowns] to lock dropdown values.
;
[Matchmaking]
Enabled=True
ApiUrl=http://localhost:3000
Ladder=sim-ra2
Casual=True
DefaultSide=0

[MatchmakingModes]
0=1v1
1=2v2
2=3v3
3=2v2v2v2
4=4v4

[1v1]
UIName=1v1
PlayerCount=2
AssignTeams=False
AlliedSideNames=Allies,Allied
SovietSideNames=Soviets,Soviet
AlliedColors=Blue,Green,Cyan,Yellow
SovietColors=Red,Orange,Purple,Grey

[1v1_Maps]
0=C1C9FC820EC9FBB4932D2FAFECA317B9D889D839, A Hill Between, hillbtwn.map
1=9403314549EBCE94AA37FC5B2A8489D289016998, Fjord, 2_fjord.map

